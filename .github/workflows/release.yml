name: Mobile Release Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass appkeystorepass -keypass appkeystorepass -dname "CN=SpecPass, OU=Mobile, O=SpecPass, L=City, S=State, C=US"
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Build Simulator for browser testing on Appetize.io
      - run: |
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r App-iOS-Simulator.zip Runner.app
      # Build Unsigned IPA for Sideloadly / AltStore USB install
      - run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r App-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: build/ios/iphonesimulator/App-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/App-Unsigned.ipa
