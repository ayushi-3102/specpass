<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="specpass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>specpass</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- 100% Offline Local MediaPipe Neural AI Segmentation -->
  <script src="mediapipe/selfie_segmentation.js"></script>
  <script src="mediapipe_segmenter.js"></script>

  <!-- High-Precision Studio Portrait Matting (@imgly/background-removal) -->
  <script type="module">
    let removeBgPromise = null;
    async function getRemoveBg() {
      if (!removeBgPromise) {
        removeBgPromise = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm')
          .then(m => m.removeBackground)
          .catch(e => {
            console.warn('[SpecPass] Error loading @imgly:', e);
            removeBgPromise = null;
            return null;
          });
      }
      return removeBgPromise;
    }

    // Pre-warm on window load
    window.addEventListener('load', () => { getRemoveBg(); });

    window.runImglyBackgroundRemoval = async function(base64Image) {
      try {
        const removeBg = await getRemoveBg();
        if (!removeBg) return null;

        const blob = await removeBg(base64Image, {
          model: 'medium',
          output: { format: 'image/png', quality: 0.95 }
        });

        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(blob);
        });
      } catch (err) {
        console.error('[SpecPass] runImglyBackgroundRemoval error:', err);
        return null;
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
